<title>Coach Masse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: date bar + day header, then two columns (séance | nutrition + poids), one column under 900px */
:root{
  --bg:#edf0f3; --surface:#ffffff; --ink:#15202b; --muted:#5b6977; --line:#d5dce3;
  --accent:#1f5fd6; --accent-ink:#ffffff; --accent-soft:#e2ebfb; --ok:#1d8550; --ok-soft:#e1f3e8;
  --warn:#b85a08; --warn-soft:#fbeedd; --track:#e3e8ed; --danger:#b42318;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --surface:#161d25; --ink:#e5eaef; --muted:#93a1ae; --line:#29333e;
  --accent:#6e9bff; --accent-ink:#0b1220; --accent-soft:#1b2944; --ok:#4cc48a; --ok-soft:#14301f;
  --warn:#f0a04b; --warn-soft:#3a2a14; --track:#222c37; --danger:#ff7b6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#161d25; --ink:#e5eaef; --muted:#93a1ae; --line:#29333e;
  --accent:#6e9bff; --accent-ink:#0b1220; --accent-soft:#1b2944; --ok:#4cc48a; --ok-soft:#14301f;
  --warn:#f0a04b; --warn-soft:#3a2a14; --track:#222c37; --danger:#ff7b6e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:2rem;text-transform:uppercase}
h2{font-size:1.45rem;text-transform:uppercase}
h3{font-size:1.15rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:.5rem .85rem;font-weight:500}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink)}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;min-width:0}
textarea{width:100%;resize:vertical;min-height:4.2rem}

/* Top bar */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand .eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.datenav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.datenav .d{font-family:var(--display);font-size:1.3rem;font-weight:600;min-width:11ch;text-align:center;text-transform:capitalize}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat .k{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.1}
.stat .s{font-size:.8rem;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Session */
.session-tag{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.session-tag.done{background:var(--ok-soft);color:var(--ok)}
.session-tag.rest{background:var(--warn-soft);color:var(--warn)}
.big-session{font-family:var(--display);font-size:2.4rem;font-weight:700;text-transform:uppercase;line-height:1}
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ex-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ex-name{font-weight:600}
.scheme{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.hint{font-size:.85rem;padding:6px 10px;border-radius:8px;background:var(--bg);color:var(--muted)}
.hint.up{background:var(--ok-soft);color:var(--ok);font-weight:500}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.set{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--bg)}
.set .n{font-size:.7rem;color:var(--muted);font-weight:600}
.set input{width:100%;border:none;background:transparent;padding:4px 2px;font-family:var(--mono);font-size:.9rem;text-align:right}
.set .u{font-size:.7rem;color:var(--muted)}
.set.filled{border-color:var(--accent)}

/* Nutrition */
.bars{display:flex;flex-direction:column;gap:10px}
.bar .lbl{display:flex;justify-content:space-between;font-size:.85rem;gap:8px}
.bar .lbl b{font-weight:600}
.track{height:10px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--accent);border-radius:999px}
.fill.ok{background:var(--ok)}
.fill.over{background:var(--warn)}
.meal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.meal .t{font-weight:600}
.meal .d{font-size:.82rem;color:var(--muted);grid-column:1/-1}
.macros{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.chip{font-family:var(--mono);font-size:.75rem;padding:2px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.chip.k{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.manual{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.manual label{display:flex;flex-direction:column;font-size:.72rem;color:var(--muted);gap:2px}
.manual input{width:100%;font-family:var(--mono)}
details>summary{cursor:pointer;color:var(--muted);font-size:.85rem}
.coach{white-space:pre-wrap;font-size:.92rem;background:var(--bg);border-radius:10px;padding:12px 14px;border-left:3px solid var(--accent)}
.notice{font-size:.85rem;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}

/* Chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .target{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.chart .avg{stroke:var(--accent);stroke-width:2.5;fill:none}
.chart .pt{fill:var(--accent);opacity:.35}
.chart .last{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:0;border-top:2.5px solid var(--accent);vertical-align:middle;margin-right:5px}
.legend i.t{border-top:1.5px dashed var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);z-index:20}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
</style>

<div class="wrap" id="app">
  <div class="top">
    <div class="brand"><div class="eyebrow">67 → 75 kg · 24 nov. → 24 févr.</div><h1>Coach Masse</h1></div>
  </div>
  <div class="panel"><p class="muted">Chargement de ton suivi…</p></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const START = "2026-11-24", END = "2027-02-24", W0 = 67, WGOAL = 75;

const PROGRAM = {
  push: { name: "Push", sub: "Pecs · Épaules · Triceps", ex: [
    { id: "bench", n: "Développé couché (barre ou haltères)", s: 4, lo: 6, hi: 8, inc: 2.5 },
    { id: "incline", n: "Développé incliné haltères", s: 3, lo: 8, hi: 10, inc: 2 },
    { id: "ohp", n: "Développé militaire", s: 3, lo: 6, hi: 8, inc: 2.5 },
    { id: "lat", n: "Élévations latérales", s: 4, lo: 12, hi: 15, inc: 1 },
    { id: "fly", n: "Pec fly", s: 3, lo: 10, hi: 12, inc: 2.5 },
    { id: "rope", n: "Extension triceps poulie corde", s: 3, lo: 10, hi: 12, inc: 1.25 } ] },
  pull: { name: "Pull", sub: "Dos · Biceps · Arrière d'épaule", ex: [
    { id: "pullup", n: "Tractions pronation (lest en kg)", s: 4, lo: 6, hi: 10, inc: 2.5, bw: true },
    { id: "row", n: "Rowing barre", s: 4, lo: 8, hi: 10, inc: 2.5 },
    { id: "cablerow", n: "Tirage poulie basse", s: 3, lo: 10, hi: 12, inc: 2.5 },
    { id: "facepull", n: "Face pulls", s: 3, lo: 12, hi: 15, inc: 1.25 },
    { id: "curlbar", n: "Curl barre", s: 3, lo: 8, hi: 10, inc: 2.5 },
    { id: "hammer", n: "Curl marteau", s: 3, lo: 10, hi: 12, inc: 1 } ] },
  legs: { name: "Legs", sub: "Quadris · Ischios · Fessiers · Mollets", ex: [
    { id: "squat", n: "Squat", s: 4, lo: 6, hi: 8, inc: 2.5 },
    { id: "rdl", n: "Soulevé de terre jambes tendues", s: 3, lo: 8, hi: 10, inc: 2.5 },
    { id: "lunge", n: "Fentes marchées (reps par jambe)", s: 3, lo: 10, hi: 12, inc: 2 },
    { id: "legcurl", n: "Leg curl", s: 3, lo: 10, hi: 12, inc: 2.5 },
    { id: "legext", n: "Leg extension", s: 3, lo: 10, hi: 12, inc: 2.5 },
    { id: "calf", n: "Mollets assis", s: 4, lo: 12, hi: 15, inc: 2.5 },
    { id: "adduct", n: "Adducteurs (optionnel)", s: 2, lo: 12, hi: 15, inc: 2.5 } ] },
  upper: { name: "Upper", sub: "Haut du corps complet + abdos", ex: [
    { id: "chestpress", n: "Chest press machine", s: 3, lo: 8, hi: 10, inc: 2.5 },
    { id: "latpd", n: "Tirage vertical", s: 3, lo: 8, hi: 10, inc: 2.5 },
    { id: "dips", n: "Dips (lest en kg)", s: 3, lo: 6, hi: 12, inc: 2.5, bw: true },
    { id: "dbrow", n: "Rowing haltère un bras", s: 3, lo: 10, hi: 12, inc: 2 },
    { id: "lat", n: "Élévations latérales", s: 3, lo: 12, hi: 15, inc: 1 },
    { id: "dbcurl", n: "Curl haltères (enchaîné avec ↓)", s: 3, lo: 10, hi: 12, inc: 1 },
    { id: "ohext", n: "Extension triceps poulie", s: 3, lo: 10, hi: 12, inc: 1.25 },
    { id: "prayer", n: "Crunch prière", s: 3, lo: 12, hi: 15, inc: 2.5 },
    { id: "oblique", n: "Machine obliques", s: 3, lo: 12, hi: 15, inc: 2.5 } ] }
};
const ORDER = { 4: ["push", "pull", "legs", "upper"], 3: ["push", "pull", "legs"] };

let cfg = { kcal: 3000, p: 140, c: 420, f: 80, mode: 4 };
let days = {};
let cur = iso(new Date());
let store = null, sample = null, imagesOk = false, offline = false, loaded = false;
let mealDraft = { text: "", kcal: "", p: "", c: "", f: "" };
let busyMeal = false, coachText = "", coachBusy = false, pendingPhoto = null;
const pending = {}, timers = {};

/* ---------- dates ---------- */
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function parse(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const t = parse(s); t.setDate(t.getDate() + n); return iso(t); }
function diff(a, b) { const A = parse(a), B = parse(b); return Math.round((Date.UTC(B.getFullYear(), B.getMonth(), B.getDate()) - Date.UTC(A.getFullYear(), A.getMonth(), A.getDate())) / 864e5); }
function longDate(s) { return parse(s).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }); }
function shortDate(s) { return parse(s).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" }); }
const TOTAL_DAYS = diff(START, END);
function targetWeight(s) { const t = Math.min(Math.max(diff(START, s), 0), TOTAL_DAYS); return W0 + (WGOAL - W0) * t / TOTAL_DAYS; }

/* ---------- state helpers ---------- */
function day(id) { if (!days[id]) days[id] = { date: id, meals: [] }; if (!Array.isArray(days[id].meals)) days[id].meals = []; return days[id]; }
function totals(id) { const t = { kcal: 0, p: 0, c: 0, f: 0 }; for (const m of (days[id] && days[id].meals) || []) for (const k in t) t[k] += +m[k] || 0; return t; }
function kcalTarget(id) { return cfg.kcal + ((days[id] && days[id].tennis) ? 300 : 0); }
function weights() { return Object.keys(days).filter(k => +days[k].weight > 0).sort().map(k => ({ d: k, w: +days[k].weight })); }
function avg7(upTo) { const ws = weights().filter(x => x.d <= upTo && diff(x.d, upTo) < 7); return ws.length ? ws.reduce((a, b) => a + b.w, 0) / ws.length : null; }
function doneWorkouts() { return Object.keys(days).filter(k => days[k].workout && days[k].workout.done).sort(); }

function plan(id) {
  const d = days[id] || {};
  if (d.workout && d.workout.key) return { key: d.workout.key, started: true, done: !!d.workout.done };
  const order = ORDER[cfg.mode] || ORDER[4];
  const prev = doneWorkouts().filter(k => k < id);
  let key = order[0];
  if (prev.length) { const lk = days[prev[prev.length - 1]].workout.key; const i = order.indexOf(lk); key = order[(i + 1) % order.length]; }
  const last6 = prev.filter(k => diff(k, id) <= 6).length;
  const twoInRow = prev.includes(addDays(id, -1)) && prev.includes(addDays(id, -2));
  const restAdvised = twoInRow || last6 >= cfg.mode;
  return { key, rest: !!d.rest, restAdvised, reason: twoInRow ? "2 séances d'affilée hier et avant-hier" : (last6 >= cfg.mode ? `${last6} séances ces 6 derniers jours` : "") };
}

function lastPerf(exId, before) {
  const ks = Object.keys(days).filter(k => k < before).sort().reverse();
  for (const k of ks) {
    const w = days[k].workout, s = w && w.sets && w.sets[exId];
    if (Array.isArray(s)) { const ok = s.filter(x => x && +x.reps > 0); if (ok.length) return { date: k, sets: ok }; }
  }
  return null;
}
function round(x) { return Math.round(x * 4) / 4; }
function suggest(ex, before) {
  const l = lastPerf(ex.id, before);
  if (!l) return { kg: null, text: ex.bw ? `Première fois : poids du corps, vise ${ex.lo}–${ex.hi} reps.` : `Première fois : choisis une charge pour ${ex.lo}–${ex.hi} reps en gardant 1–2 reps en réserve.` };
  const kg = +l.sets[0].kg || 0;
  const reps = l.sets.map(s => +s.reps);
  const past = `Dernière fois (${shortDate(l.date)}) : ${kg} kg × ${reps.join("/")}`;
  if (l.sets.length >= ex.s && reps.every(r => r >= ex.hi)) return { kg: round(kg + ex.inc), up: true, past, text: `On monte : ${round(kg + ex.inc)} kg, vise ${ex.lo}+ reps par série.` };
  const tgt = []; for (let i = 0; i < ex.s; i++) tgt.push(Math.min(ex.hi, (reps[i] || reps[reps.length - 1]) + 1));
  return { kg, past, text: `Même charge (${kg} kg), vise ${tgt.join("/")}.`, tgt };
}

/* ---------- storage ---------- */
function persist(id, delay) {
  clearTimeout(timers[id]);
  const run = () => {
    delete timers[id];
    const data = JSON.parse(JSON.stringify(days[id]));
    pending[id] = (pending[id] || 0) + 1;
    Promise.resolve(store.saveDay(id, data))
      .catch(e => toast("Enregistrement impossible : " + ((e && (e.message || e.code)) || "erreur")))
      .finally(() => { pending[id]--; });
  };
  if (delay) timers[id] = setTimeout(run, delay); else run();
}
function localStore() {
  let raw = null; try { raw = JSON.parse(localStorage.getItem("coach-masse") || "null"); } catch (e) {}
  if (raw) { days = raw.days || {}; cfg = Object.assign(cfg, raw.cfg || {}); }
  const dump = () => { try { localStorage.setItem("coach-masse", JSON.stringify({ days, cfg })); } catch (e) {} };
  return { saveDay: dump, saveCfg: dump };
}
async function connect() {
  const c = window.claude;
  const [db, smp] = await Promise.all([
    c && c.use ? c.use("db").catch(() => null) : null,
    c && c.use ? c.use("sample").catch(() => null) : null ]);
  sample = smp;
  if (sample && sample.limits) { try { imagesOk = !!(await sample.limits()).images; } catch (e) { imagesOk = false; } }
  if (!db) { offline = true; store = localStore(); loaded = true; render(); return; }
  store = {
    saveDay: (id, data) => db.collection("days").doc(id).set(data),
    saveCfg: data => db.doc("config/profile").set(data)
  };
  const fail = setTimeout(() => { if (!loaded) { offline = true; store = localStore(); loaded = true; render(); } }, 10000);
  db.collection("days").onSnapshot(snap => {
    clearTimeout(fail);
    const next = {};
    for (const d of snap.docs) next[d.id] = d.data();
    for (const id in days) if (pending[id] > 0 || timers[id]) next[id] = days[id];
    days = next; loaded = true; render();
  }, e => { clearTimeout(fail); toast("Lecture impossible : " + (e.message || e.code)); });
  db.doc("config/profile").onSnapshot(s => { if (s.exists) { cfg = Object.assign({}, cfg, s.data()); render(); } }, () => {});
}

/* ---------- DOM ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k]; if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(3)) { if (c == null || c === false) continue; e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return e;
}
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3500); }
const fmt = (n, d = 0) => Number(n).toLocaleString("fr-FR", { maximumFractionDigits: d, minimumFractionDigits: d });

function render() {
  const app = document.getElementById("app");
  const a = document.activeElement, fid = a && a.id && app.contains(a) ? a.id : null;
  const sel = fid && a.setSelectionRange && typeof a.selectionStart === "number" ? [a.selectionStart, a.selectionEnd] : null;
  const scroll = window.scrollY;
  app.replaceChildren(header(), stats(), h("div", { class: "grid" },
    h("div", { class: "col" }, sessionPanel(), coachPanel()),
    h("div", { class: "col" }, foodPanel(), weightPanel(), settingsPanel())));
  if (fid) { const n = document.getElementById(fid); if (n) { n.focus({ preventScroll: true }); if (sel && n.setSelectionRange) try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  window.scrollTo(0, scroll);
}

function header() {
  const today = iso(new Date());
  return h("div", { class: "top" },
    h("div", { class: "brand" }, h("div", { class: "eyebrow", text: "67 → 75 kg · 24 nov. → 24 févr." }), h("h1", { text: "Coach Masse" })),
    h("div", { class: "datenav" },
      h("button", { class: "ghost", "aria-label": "Jour précédent", onclick: () => { cur = addDays(cur, -1); coachText = ""; render(); } }, "‹"),
      h("span", { class: "d", text: cur === today ? "Aujourd'hui" : longDate(cur) }),
      h("button", { class: "ghost", "aria-label": "Jour suivant", onclick: () => { cur = addDays(cur, 1); coachText = ""; render(); } }, "›"),
      cur !== today ? h("button", { onclick: () => { cur = today; coachText = ""; render(); } }, "Aujourd'hui") : null));
}

function stats() {
  const dn = diff(START, cur) + 1, a = avg7(cur), tw = targetWeight(cur), t = totals(cur);
  const cells = [

/* ---------- session ---------- */
function setWorkoutKey(key) { const d = day(cur); d.workout = { key, done: false, sets: (d.workout && d.workout.key === key && d.workout.sets) || {} }; delete d.rest; persist(cur); render(); }

/* ---------- food ---------- */

}
function num(v) { const n = Math.round(+v); return isFinite(n) && n >= 0 ? n : 0; }

/* ---------- weight ---------- */

function chart() {

  for (let v = 66; v <= 76; v += 2) { svg.append(el("line", { class: "grid-l", x1: L, x2: W - R, y1: y(v), y2: y(v) })); const t = el("text", { x: L - 6, y: y(v) + 3, "text-anchor": "end" }); t.textContent = v; svg.append(t); }
